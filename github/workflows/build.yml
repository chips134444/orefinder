name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: "orefinder-mod-project (1)/orefinder"
      - uses: actions/upload-artifact@v4
        with:
          name: orefinder-jar
          path: "orefinder-mod-project (1)/orefinder/build/libs/*.jar"
